server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;
    gzip_min_length 1024;

    # Sonde de santé Coolify / Docker
    location = /healthz { access_log off; return 200 "ok\n"; }

    # HTML : toujours revalidé, pour voir les mises à jour immédiatement
    location = /index.html { add_header Cache-Control "no-cache"; }

    # JS / CSS : revalidation (pas de hash dans les noms de fichiers)
    location ~* \.(js|css)$ { add_header Cache-Control "no-cache"; }

    # Images : cache long
    location ~* \.(jpg|jpeg|png|webp|svg|ico)$ { add_header Cache-Control "public, max-age=2592000"; }

    # Modèle 3D extérieur (GLB Blender, ~5,7 Mo → ~2,1 Mo gzip) : type MIME explicite (absent de mime.types),
    # cache 1 jour + revalidation ETag (nom de fichier sans hash)
    location ~* \.glb$ {
        types { model/gltf-binary glb; }
        add_header Cache-Control "public, max-age=86400";
    }

    location / { try_files $uri $uri/ /index.html; }
}
