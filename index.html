<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DIÈDRE 29 — Configurateur</title>
  <meta name="description" content="Configurez le DIÈDRE 29, concept de yacht électrique de 28,8 m dessiné par NEOKROME.">
  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // thème mémorisé appliqué avant le premier rendu (évite le flash)
    try { var t = localStorage.getItem('d29-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <script type="importmap">{"imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
  <noscript><p style="padding:24px;color:#fff;background:#0e1420">Ce configurateur nécessite JavaScript.</p></noscript>
  <!-- Écran de chargement statique : visible pendant le téléchargement de three.js,
       repris ensuite par js/ui.js (setLoading). -->
  <div id="loader" class="loader" role="progressbar" aria-label="Chargement du configurateur" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="loader__inner">
      <div class="loader__box" aria-hidden="true">
        <svg viewBox="0 0 220 230">
          <polygon class="lb-l" points="0,42 99,112 99,229 0,172"/>
          <polygon class="lb-r" points="140,122 219,72 219,172 140,229"/>
          <polygon class="lb-t" points="78,45 204,1 205,69 139,100"/>
        </svg>
      </div>
      <p class="loader__studio eyebrow">NEOKROME · Étude de concept</p>
      <p class="loader__title">DIÈDRE 29<span class="b">.</span></p>
      <p class="loader__tagline">Concept de yacht électrique · 28,8 m</p>
      <div class="loader__bar"><span class="loader__fill"></span></div>
      <p class="loader__pct"><span class="loader__num">0</span> %</p>
    </div>
  </div>
  <script>
    // lien partagé vers le catamaran (#…model=cat24) : écran de chargement à son nom dès le premier affichage
    try { if (/(^|[#&])model=cat24(&|$)/.test(location.hash)) {
      document.querySelector('.loader__title').innerHTML = 'DIÈDRE 24<span class="b">.</span>';
      document.querySelector('.loader__tagline').textContent = 'Catamaran électrique · 24,0 m';
      document.title = 'DIÈDRE 24 — Configurateur';
    } } catch (e) {}
  </script>
  <!-- Le reste de l'interface (barre haute, viewport, panneau, modales) est généré par js/ui.js dans #app -->
  <div id="app" class="app"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
